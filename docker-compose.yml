version: '3.8'

services:
  autovideo-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: autovideo_batch_studio
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    env_file:
      - .env
